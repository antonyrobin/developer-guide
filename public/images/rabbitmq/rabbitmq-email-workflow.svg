<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450">
  <rect width="940" height="450" rx="16" fill="#0f172a"/>
  <text x="470" y="38" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" font-family="Segoe UI,Arial,sans-serif">RabbitMQ High-Scale Multi-Recipient Email Broadcast Engine</text>

  <!-- User Action -->
  <g transform="translate(30, 80)">
    <rect width="130" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700" font-family="Segoe UI,Arial,sans-serif">User Trigger</text>
    <rect x="15" y="45" width="100" height="45" rx="6" fill="#0f172a"/>
    <text x="65" y="65" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Send Email</text>
    <text x="65" y="80" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="Segoe UI,Arial,sans-serif">10,000 Users</text>
    <text x="65" y="115" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Segoe UI,Arial,sans-serif">Async REST Call</text>
    <text x="65" y="130" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Segoe UI,Arial,sans-serif">202 Accepted</text>
  </g>

  <!-- Arrow -->
  <line x1="160" y1="155" x2="190" y2="155" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="190,155 182,150 182,160" fill="#60a5fa"/>

  <!-- Batch Chunk Producer -->
  <g transform="translate(195, 80)">
    <rect width="145" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="72" y="28" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Broadcast Producer</text>
    <rect x="10" y="40" width="125" height="40" rx="6" fill="#0f172a"/>
    <text x="72" y="58" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">1. Splits into Chunks</text>
    <text x="72" y="72" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Segoe UI,Arial,sans-serif">(e.g. 50 msgs / batch)</text>
    <rect x="10" y="85" width="125" height="50" rx="6" fill="#0f172a"/>
    <text x="72" y="103" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600" font-family="Segoe UI,Arial,sans-serif">2. Encrypts PII /</text>
    <text x="72" y="117" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Claim-Check Token</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="155" x2="370" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="370,155 362,150 362,160" fill="#38bdf8"/>

  <!-- Topic/Fanout Exchange -->
  <g transform="translate(375, 80)">
    <polygon points="65,10 130,80 65,150 0,80" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="70" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Direct/Topic</text>
    <text x="65" y="88" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Exchange</text>
    <text x="65" y="105" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Segoe UI,Arial,sans-serif">email.broadcast</text>
  </g>

  <!-- Arrow to Quorum Queue -->
  <line x1="505" y1="130" x2="545" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="545,110 535,108 538,118" fill="#f59e0b"/>

  <!-- Arrow to Dead Letter Exchange -->
  <line x1="505" y1="165" x2="545" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="545,280 537,272 546,270" fill="#ef4444"/>

  <!-- High-Traffic Quorum / Lazy Queue -->
  <g transform="translate(545, 60)">
    <rect width="180" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">email.dispatch.queue</text>
    <text x="90" y="42" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Segoe UI,Arial,sans-serif">(Quorum / Lazy Mode)</text>
    <rect x="15" y="52" width="150" height="55" rx="6" fill="#0f172a"/>
    <text x="90" y="70" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">Prefetch Count = 50</text>
    <text x="90" y="85" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">delivery_mode = 2 (Durable)</text>
    <text x="90" y="99" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="Segoe UI,Arial,sans-serif">x-dead-letter-exchange set</text>
  </g>

  <!-- Arrow to Workers -->
  <line x1="725" y1="120" x2="760" y2="120" stroke="#10b981" stroke-width="2"/>
  <polygon points="760,120 752,115 752,125" fill="#10b981"/>

  <!-- Consumer Workers Pool -->
  <g transform="translate(765, 60)">
    <rect width="145" height="175" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="72" y="25" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Email Workers Pool</text>
    
    <rect x="10" y="38" width="125" height="28" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="72" y="56" text-anchor="middle" fill="#fff" font-size="10" font-family="Segoe UI,Arial,sans-serif">Worker #1</text>
    
    <rect x="10" y="70" width="125" height="28" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="72" y="88" text-anchor="middle" fill="#fff" font-size="10" font-family="Segoe UI,Arial,sans-serif">Worker #2</text>
    
    <rect x="10" y="102" width="125" height="28" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="72" y="120" text-anchor="middle" fill="#fff" font-size="10" font-family="Segoe UI,Arial,sans-serif">Worker #N</text>

    <text x="72" y="148" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">SMTP / SendGrid API</text>
    <text x="72" y="162" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Manual ack() after send</text>
  </g>

  <!-- Bottom: Resilience, DLQ and Retry Queue -->
  <g transform="translate(195, 260)">
    <rect width="695" height="155" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="347" y="26" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Failure Handling, Retry Backoff &amp; Poison Message Quarantine</text>
    
    <!-- Step 1: Retry Queue -->
    <rect x="20" y="42" width="200" height="95" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="120" y="62" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif">1. Retry Queue with TTL</text>
    <text x="120" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">x-message-ttl: 5000ms</text>
    <text x="120" y="98" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">Re-routes after expiry</text>
    <text x="120" y="118" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="Segoe UI,Arial,sans-serif">Up to 3-5 retry attempts</text>

    <!-- Step 2: DLQ -->
    <rect x="245" y="42" width="200" height="95" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="345" y="62" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif">2. Dead Letter Queue (DLQ)</text>
    <text x="345" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">email.dlq</text>
    <text x="345" y="98" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">Captures max-retry failures</text>
    <text x="345" y="118" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="Segoe UI,Arial,sans-serif">Alerts on-call engineers</text>

    <!-- Step 3: Idempotency & Deduplication -->
    <rect x="470" y="42" width="205" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="572" y="62" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif">3. Redis Deduplication</text>
    <text x="572" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">SET msg_id:x "PROCESSED"</text>
    <text x="572" y="98" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="Segoe UI,Arial,sans-serif">EX 86400 NX</text>
    <text x="572" y="118" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="Segoe UI,Arial,sans-serif">Prevents duplicate emails</text>
  </g>
</svg>
