<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440">
  <rect width="920" height="440" rx="16" fill="#0f172a"/>
  <text x="460" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Java 21+: Platform Threads vs Virtual Threads</text>
  
  <!-- Left Side: Platform Threads -->
  <rect x="40" y="75" width="395" height="300" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="55" y="85" width="365" height="30" rx="6" fill="#991b1b"/>
  <text x="237" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Traditional Platform Threads (1:1 with OS)</text>

  <!-- Tasks -->
  <g transform="translate(60, 130)">
    <rect width="105" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="52" y="22" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Thread #1 (~1MB)</text>
  </g>
  <g transform="translate(180, 130)">
    <rect width="105" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="52" y="22" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Thread #2 (~1MB)</text>
  </g>
  <g transform="translate(300, 130)">
    <rect width="105" height="35" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="52" y="22" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Thread #N (~1MB)</text>
  </g>

  <!-- OS Thread Mapping -->
  <line x1="112" y1="165" x2="112" y2="210" stroke="#f87171" stroke-width="2"/>
  <line x1="232" y1="165" x2="232" y2="210" stroke="#f87171" stroke-width="2"/>
  <line x1="352" y1="165" x2="352" y2="210" stroke="#f87171" stroke-width="2"/>

  <rect x="60" y="210" width="355" height="50" rx="8" fill="#334155" stroke="#ef4444" stroke-width="1"/>
  <text x="237" y="235" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">OS Kernel Thread Pool</text>
  <text x="237" y="250" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI,Arial,sans-serif">Expensive context switching • Max ~2,000 - 5,000 threads</text>

  <rect x="60" y="280" width="355" height="80" rx="8" fill="#0f172a"/>
  <text x="75" y="303" fill="#fca5a5" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">❌ Heavyweight stack allocation (1 MB each)</text>
  <text x="75" y="325" fill="#fca5a5" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">❌ Thread blocks on I/O (Database / HTTP / File)</text>
  <text x="75" y="347" fill="#fca5a5" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">❌ Requires complex async reactive code (Mono/Flux)</text>

  <!-- Right Side: Virtual Threads -->
  <rect x="485" y="75" width="395" height="300" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="500" y="85" width="365" height="30" rx="6" fill="#065f46"/>
  <text x="682" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Virtual Threads (Project Loom / M:N)</text>

  <!-- Virtual threads cloud -->
  <rect x="505" y="125" width="355" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="682" y="145" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Millions of Virtual Threads (~1KB each)</text>
  <text x="682" y="162" text-anchor="middle" fill="#a7f3d0" font-size="10" font-family="Segoe UI,Arial,sans-serif">vThread#1, vThread#2, ... vThread#1,000,000</text>

  <!-- Downward arrows to carrier threads -->
  <path d="M 600 175 L 600 210" stroke="#34d399" stroke-width="2"/>
  <path d="M 682 175 L 682 210" stroke="#34d399" stroke-width="2"/>
  <path d="M 764 175 L 764 210" stroke="#34d399" stroke-width="2"/>

  <rect x="505" y="210" width="355" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="682" y="232" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Carrier Platform Threads (ForkJoinPool = CPU Cores)</text>
  <text x="682" y="249" text-anchor="middle" fill="#a7f3d0" font-size="11" font-family="Segoe UI,Arial,sans-serif">Unmounts on I/O block, mounts when I/O completes</text>

  <rect x="505" y="280" width="355" height="80" rx="8" fill="#0f172a"/>
  <text x="520" y="303" fill="#6ee7b7" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">✅ Lightweight (~1 KB memory footprint)</text>
  <text x="520" y="325" fill="#6ee7b7" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">✅ Straightforward synchronous code style</text>
  <text x="520" y="347" fill="#6ee7b7" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">✅ High throughput: 1,000,000+ concurrent requests</text>

  <!-- Footer Banner -->
  <rect x="40" y="390" width="840" height="34" rx="8" fill="#1e293b"/>
  <text x="460" y="412" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Executors.newVirtualThreadPerTaskExecutor() • Thread.ofVirtual().start(runnable)</text>
</svg>
